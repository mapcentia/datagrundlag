[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

# Planlagte funktioner (netlify/functions/) bundles med esbuild
[functions]
  node_bundler = "esbuild"

# Astros filer har hash i navnet og kan caches for evigt
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify sender selv max-age=0, must-revalidate på HTML, så en ny natlig build ses med det samme
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
